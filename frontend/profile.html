<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile – AIConnectPro</title><link rel="stylesheet" href="workspace.css"></head><body class="workspace-page profile-page"><header class="workspace-header"><div class="workspace-header-inner">
  <a class="workspace-brand" href="index.html"><span class="workspace-mark">A</span> AIConnectPro</a>
  <nav class="workspace-nav" aria-label="Main navigation"><a href="jobs.html">Jobs</a><a href="resume.html">Resume Builder</a><a href="profile.html">My Profile</a></nav>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button>
</div></header><main class="workspace-main"><p class="eyebrow">YOUR ACCOUNT</p><h1>My Profile</h1><p id="info" role="status">Loading your profile…</p><section class="workspace-card"><h2>My Resumes</h2><div id="resumes"></div></section><section class="workspace-card"><h2>My Reels</h2><div id="reels"></div></section><section class="workspace-card"><h2 id="jobsTitle"></h2><div id="jobs"></div></section></main><script src="theme.js" defer></script><script>
const token = localStorage.getItem('token');
const headers = token ? { Authorization: 'Bearer ' + token } : {};
const byId = id => document.getElementById(id);
async function getJson(url) {
  const response = await fetch(url, { headers });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || 'Could not load profile data.');
  return body;
}
function addCard(container, text) {
  const card = document.createElement('div');
  card.className = 'card';
  card.textContent = text;
  container.appendChild(card);
}
async function loadProfile() {
  if (!token) { window.location.replace('login.html'); return; }
  try {
    const profile = await getJson('/api/profile/me');
    byId('info').textContent = 'Role: ' + profile.role;
    await Promise.all([loadResumes(), loadReels()]);
    if (profile.role === 'company') {
      byId('jobsTitle').textContent = 'Jobs Posted';
      await loadPostedJobs();
    } else {
      byId('jobsTitle').textContent = 'Jobs Applied';
      await loadAppliedJobs();
    }
  } catch (error) {
    byId('info').textContent = error.message;
  }
}
async function loadResumes() {
  const rows = await getJson('/api/resume?mine=true');
  const container = byId('resumes');
  rows.forEach(resume => {
    const card = document.createElement('div');
    card.className = 'card';
    card.append('Template: ' + (resume.template || 'classic') + ' ');
    const link = document.createElement('a');
    link.href = '#';
    link.textContent = 'Preview';
    link.addEventListener('click', async event => {
      event.preventDefault();
      const previewWindow = window.open('about:blank', '_blank');
      try {
        const response = await fetch('/api/resume/' + encodeURIComponent(resume.id) + '/html', { headers });
        if (!response.ok) throw new Error('Could not load resume preview.');
        const html = await response.text();
        const blobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
        if (previewWindow) previewWindow.location = blobUrl;
        else window.location.assign(blobUrl);
      } catch (error) {
        if (previewWindow) previewWindow.close();
        byId('info').textContent = error.message;
      }
    });
    card.appendChild(link);
    container.appendChild(card);
  });
}
async function loadReels() {
  const result = await getJson('/api/reels?mine=true');
  (result.reels || []).forEach(reel => addCard(byId('reels'), reel.body || reel.title || 'Reel'));
}
async function loadAppliedJobs() {
  const rows = await getJson('/api/jobs/applied');
  rows.forEach(row => {
    const job = Array.isArray(row.jobs) ? row.jobs[0] : row.jobs;
    if (job) addCard(byId('jobs'), job.title + ' (' + job.type + ')');
  });
}
async function loadPostedJobs() {
  const rows = await getJson('/api/jobs/posted');
  rows.forEach(job => addCard(byId('jobs'), job.title + ' (' + job.type + ')'));
}
loadProfile();
</script></body></html>
