<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Share knowledge and connect with the AIConnectPro community.">
  <title>Community Reels – AIConnectPro</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .reels-main{max-width:820px;padding-block:2rem 4rem}
    .reel-card,.reel-create{padding:1.25rem;border:1px solid var(--border,#e2e8f0);border-radius:20px;background:var(--surface,#fff);box-shadow:0 10px 28px rgba(32,48,82,.06);margin-bottom:1rem}
    .reel-create{display:grid;gap:.8rem}
    .reel-create input,.reel-create textarea,.reel-create select,.reel-comment-form input{width:100%;box-sizing:border-box;padding:.8rem .9rem;border:1px solid var(--border,#cbd5e1);border-radius:10px;background:var(--surface,#fff);color:inherit;font:inherit}
    .reel-create textarea{min-height:100px;resize:vertical}
    .reel-header{display:flex;justify-content:space-between;gap:1rem;align-items:start;color:var(--muted,#65718a);font-size:.85rem}
    .reel-title{color:inherit;font-size:1.08rem}
    .reel-date{white-space:nowrap}
    .reel-body{white-space:pre-wrap;line-height:1.6}
    .reel-media{display:block;max-width:100%;max-height:560px;margin:1rem auto;border-radius:14px}
    .reel-actions{display:flex;gap:.6rem;flex-wrap:wrap;border-top:1px solid var(--border,#e2e8f0);padding-top:.8rem}
    .reel-action{border:1px solid var(--border,#cbd5e1);border-radius:999px;padding:.55rem .85rem;background:transparent;color:inherit;cursor:pointer;font:inherit}
    .reel-comments{padding-top:.7rem}
    .reel-comment{margin:.5rem 0;line-height:1.5}
    .reel-comment-form{display:flex;gap:.5rem;margin-top:.75rem}
    .reel-help,.reel-status{color:var(--muted,#65718a);font-size:.9rem}
    .reel-heading{margin-bottom:.4rem}
    body[data-theme="dark"] .reel-card,body[data-theme="dark"] .reel-create{border-color:#2c3448;background:#171c2b}
    @media(max-width:600px){.reel-header{display:grid}.reel-date{white-space:normal}.reel-comment-form{flex-direction:column}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell nav-shell">
      <a class="brand" href="index.html" aria-label="AIConnectPro home"><span class="brand-mark">A</span> AIConnectPro</a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="jobs.html">Jobs</a>
        <a href="reels.html" aria-current="page">Reels</a>
        <a href="profile.html">My Profile</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span aria-hidden="true">☾</span></button>
    </div>
  </header>
  <main class="shell reels-main">
    <section aria-labelledby="page-title">
      <p class="eyebrow"><span class="eyebrow-dot"></span> COMMUNITY</p>
      <h1 id="page-title">Reels</h1>
      <p class="reel-help">Share a useful idea, photo, or short video with your professional community.</p>
    </section>
    <form id="create-form" class="reel-create">
      <h2 class="reel-heading">Create a Reel</h2>
      <label for="reel-title">Title <span class="reel-help">(optional)</span></label>
      <input id="reel-title" maxlength="160" placeholder="Give your Reel a title">
      <label for="reel-body">Your message</label>
      <textarea id="reel-body" maxlength="3000" placeholder="Share a short tip, insight, or update"></textarea>
      <label for="reel-file">Photo or video <span class="reel-help">(optional)</span></label>
      <input id="reel-file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm">
      <small id="media-help" class="reel-help">Optional photo or short video, up to 25 MB.</small>
      <label for="reel-visibility">Who can view this?</label>
      <select id="reel-visibility">
        <option value="private">Only me</option>
        <option value="public">All signed-in members</option>
      </select>
      <div><button id="post-reel" class="button button-primary" type="submit">Post Reel</button></div>
      <p id="create-result" class="reel-status" role="status" aria-live="polite"></p>
    </form>
    <section aria-labelledby="feed-heading">
      <h2 id="feed-heading">Your community feed</h2>
      <div id="feed" aria-live="polite"></div>
      <div style="text-align:center"><button id="load-more-btn" class="button button-outline" type="button">Load more</button></div>
    </section>
  </main>
  <script src="theme.js" defer></script>
  <script type="module" src="reels.js"></script>
</body>
</html>
