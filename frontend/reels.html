<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AIConnect Pro — Reels</title>
  <link rel="stylesheet" href="workspace.css">

</head>
<body class="workspace-page reels-page"><header class="workspace-header"><div class="workspace-header-inner">
  <a class="workspace-brand" href="index.html"><span class="workspace-mark">A</span> AIConnectPro</a>
  <nav class="workspace-nav" aria-label="Main navigation"><a href="jobs.html">Jobs</a><a href="resume.html">Resume Builder</a><a href="profile.html">My Profile</a></nav>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button>
</div></header>
  <main class="workspace-main">
    <div class="card">
      <h2>Create Reel</h2>
      <div id="create-form">
        <div class="form-row">
          <input id="reel-title" placeholder="Title (optional)"/>
        </div>
        <div class="form-row">
          <textarea id="reel-body" placeholder="Share a short knowledge clip, tip or link"></textarea>
        </div>
        <div class="form-row">
          <input id="reel-media" placeholder="Optional media URL (image/video)" />
        </div>
        <div class="form-row">
          <select id="reel-visibility">
            <option value="private">Only signed-in users</option>
            <option value="public">Public (not recommended)</option>
          </select>
          <button id="post-reel" class="btn btn--primary">Post Reel</button>
        </div>
        <div id="create-result" class="small"></div>
      </div>
    </div>

    <div class="card">
      <h2>Feed</h2>
      <div id="feed"></div>
      <div id="load-more" style="text-align:center; margin-top:8px;">
        <button id="load-more-btn" class="btn">Load more</button>
      </div>
    </div>
  </main>

  <script src="theme.js" defer></script>
  <script src="reels.js"></script>
</body>
</html>
