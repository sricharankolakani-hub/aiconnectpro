<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Private messages with your AIConnectPro connections.">
  <title>Messages – AIConnectPro</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .messages-main{max-width:1100px;padding-block:2rem 4rem}.messages-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
    .messages-head h1{margin:.3rem 0}.messages-layout{display:grid;grid-template-columns:minmax(240px,.7fr) minmax(0,1.5fr);min-height:580px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--white);box-shadow:var(--shadow)}
    .inbox{border-right:1px solid var(--line);padding:1rem}.inbox h2{font-size:1rem}.inbox-list{display:grid;gap:.5rem}
    .inbox-link{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:.8rem}.inbox-link[aria-current="true"]{border-color:var(--primary);background:var(--paper)}
    .inbox-avatar,.peer-avatar{display:grid;place-items:center;flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--paper);color:var(--primary);font-size:.85rem;font-weight:800}
    .inbox-link-copy{display:grid;min-width:0;flex:1;gap:.2rem}
    .inbox-link-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-width:0}
    .inbox-link-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .inbox-preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;color:var(--muted)}
    .inbox-unread-badge{display:grid;place-items:center;flex:none;min-width:1.35rem;height:1.35rem;padding:0 .25rem;border-radius:999px;background:var(--primary);color:#fff;font-size:.72rem;font-weight:800}
    body[data-theme="dark"] .inbox-avatar,body[data-theme="dark"] .peer-avatar{background:#26324a;color:#dbe6ff}
    .thread{display:flex;flex-direction:column;min-width:0}.thread-head{display:flex;align-items:center;gap:.75rem;padding:1rem;border-bottom:1px solid var(--line)}.thread-head h2{margin:0;font-size:1.1rem}
    .thread-messages{flex:1;min-height:330px;max-height:60vh;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.65rem}
    .message{max-width:min(80%,38rem);padding:.7rem .9rem;border-radius:16px;background:var(--paper);overflow-wrap:anywhere;white-space:pre-wrap}
    .message.mine{align-self:flex-end;background:var(--primary);color:#fff}.message time{display:block;font-size:.72rem;opacity:.75;margin-top:.25rem}
    .composer{display:flex;align-items:flex-end;gap:.6rem;padding:1rem;border-top:1px solid var(--line)}.message-input-wrap{flex:1;min-width:0;display:grid;gap:.25rem}.composer textarea{display:block;width:100%;min-width:0;box-sizing:border-box;resize:vertical;min-height:2.8rem;max-height:9rem;border:1px solid var(--line);border-radius:12px;padding:.7rem;font:inherit;background:var(--white);color:var(--ink)}
    .message-note,.message-empty{color:var(--muted);font-size:.9rem;padding:1rem}.composer button{flex:none}.message-compose-hint{margin-left:.25rem;color:var(--muted);font-size:.78rem}
    body[data-theme="dark"] .messages-layout{background:#171c2b;border-color:#2c3448}body[data-theme="dark"] .inbox{border-color:#2c3448}body[data-theme="dark"] .inbox-link[aria-current="true"],body[data-theme="dark"] .message:not(.mine){background:#111626}
    body[data-theme="dark"] .thread-head,body[data-theme="dark"] .composer{border-color:#2c3448}body[data-theme="dark"] .composer textarea{background:#111626;color:#edf0f8}
    @media(max-width:700px){.messages-layout{grid-template-columns:1fr}.inbox{border-right:0;border-bottom:1px solid var(--line)}.thread-messages{min-height:260px}}
    @media(max-width:480px){.composer{align-items:stretch}.message-input-wrap{width:100%}.composer button{align-self:flex-end}}
  </style>
</head>
<body>
  <header class="site-header"><div class="shell nav-shell">
    <a class="brand" href="index.html" aria-label="AIConnectPro home"><span class="brand-mark">A</span> AIConnectPro</a>
    <nav class="primary-nav" aria-label="Main navigation"><a href="jobs.html">Jobs</a><a href="connections.html">Connections</a><a href="profile.html">My Profile</a></nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span aria-hidden="true">☾</span></button>
  </div></header>
  <main class="shell messages-main">
    <div class="messages-head"><div><p class="eyebrow"><span class="eyebrow-dot"></span> YOUR NETWORK</p><h1>Messages</h1></div><button id="refresh-messages" class="button" type="button">Refresh</button></div>
    <p id="messages-status" class="message-note" role="status" aria-live="polite">Messages are available only between accepted connections.</p>
    <section class="messages-layout" aria-label="Messages">
      <aside class="inbox"><h2>Conversations</h2><div id="inbox-list" class="inbox-list" aria-live="polite"><p class="message-empty">Loading…</p></div><a class="button" href="connections.html">Find connections</a></aside>
      <section class="thread" aria-label="Conversation">
        <header class="thread-head"><span id="peer-avatar" class="peer-avatar" aria-hidden="true" hidden></span><h2 id="peer-name">Choose a conversation</h2></header>
        <div id="thread-messages" class="thread-messages" aria-live="polite"><p class="message-empty">Choose a connection to start messaging.</p></div>
        <form id="message-form" class="composer" hidden>
          <div class="message-input-wrap">
            <textarea id="message-body" maxlength="4000" required placeholder="Write a message…" aria-label="Message"></textarea>
            <span class="message-compose-hint">Enter to send · Shift+Enter for a new line</span>
          </div>
          <button class="button button-primary" type="submit">Send</button>
        </form>
      </section>
    </section>
  </main>
  <script src="theme.js" defer></script><script type="module" src="messages.js"></script>
</body>
</html>
