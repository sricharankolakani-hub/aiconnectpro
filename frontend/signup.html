<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up – AIConnectPro</title>
  <style>
    body { font: 16px Arial, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 20px; color: #17202a; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0; }
    button { cursor: pointer; }
    .password-field { display: flex; align-items: center; gap: 8px; }
    .password-field input { flex: 1; min-width: 0; }
    .password-toggle { width: 44px; height: 44px; flex: 0 0 auto; display: grid; place-items: center; padding: 0; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: #475569; }
    .password-toggle:hover { background: #f1f5f9; }
    .password-toggle:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .password-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .password-toggle .eye-closed { display: none; }
    .password-toggle[data-visible="true"] .eye-open { display: none; }
    .password-toggle[data-visible="true"] .eye-closed { display: block; }
    #msg { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Create your account</h1>
    <form id="signup-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="password-toggle" type="button" aria-controls="password" aria-label="Show password" title="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="eye-open" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle class="eye-open" cx="12" cy="12" r="3"/>
            <g class="eye-closed"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path d="m3 3 18 18"/></g>
          </svg>
        </button>
      </div>
      <button type="submit">Create account</button>
    </form>
    <button id="google-signup" type="button">Continue with Google</button>
    <p id="msg" role="status" aria-live="polite"></p>
    <p>Already registered? <a href="login.html">Log in</a></p>
  </main>

  <script type="module">
    import { signUp, signInWithGoogle } from './auth.js';

    const form = document.getElementById('signup-form');
    const message = document.getElementById('msg');
    const googleButton = document.getElementById('google-signup');
    const password = document.getElementById('password');
    const passwordToggle = document.querySelector('.password-toggle');

    passwordToggle.addEventListener('click', () => {
      const isHidden = password.type === 'password';
      password.type = isHidden ? 'text' : 'password';
      passwordToggle.dataset.visible = String(isHidden);
      passwordToggle.setAttribute('aria-pressed', String(isHidden));
      passwordToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      passwordToggle.title = isHidden ? 'Hide password' : 'Show password';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Creating your account…';
      try {
        const data = await signUp(
          document.getElementById('email').value,
          password.value
        );
        if (data.session) {
          window.location.assign('index.html');
        } else {
          message.textContent = 'Account created. Check your email to confirm, then log in.';
        }
      } catch (error) {
        message.textContent = error.message || 'Could not create your account.';
      }
    });

    googleButton.addEventListener('click', async () => {
      message.textContent = 'Redirecting to Google…';
      googleButton.disabled = true;
      try {
        await signInWithGoogle();
      } catch (error) {
        googleButton.disabled = false;
        message.textContent = error.message || 'Could not start Google sign-in.';
      }
    });
  </script>
</body>
</html>
