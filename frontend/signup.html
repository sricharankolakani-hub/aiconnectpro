<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up – AIConnectPro</title>

  <link rel="stylesheet" href="workspace.css">
</head>
<body class="workspace-page auth-page"><header class="workspace-header"><div class="workspace-header-inner">
  <a class="workspace-brand" href="index.html"><span class="workspace-mark">A</span> AIConnectPro</a>
  <nav class="workspace-nav" aria-label="Main navigation"><a href="jobs.html">Jobs</a><a href="resume.html">Resume Builder</a><a href="profile.html">My Profile</a></nav>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button>
</div></header>
  <main class="auth-main">
    <h1>Create your account</h1>
    <form id="signup-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit">Create account</button>
    </form>
    <button id="google-signup" type="button">Continue with Google</button>
    <p id="msg" role="status" aria-live="polite"></p>
    <p>Already registered? <a href="login.html">Log in</a></p>
  </main>

  <script src="theme.js" defer></script>
  <script type="module">
    import { signUp, signInWithGoogle } from './auth.js';

    const form = document.getElementById('signup-form');
    const message = document.getElementById('msg');
    const googleButton = document.getElementById('google-signup');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Creating your account…';
      try {
        const data = await signUp(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        if (data.session) {
          window.location.assign('index.html');
        } else {
          message.textContent = 'Account created. Check your email to confirm, then log in.';
        }
      } catch (error) {
        message.textContent = error.message || 'Could not create your account.';
      }
    });

    googleButton.addEventListener('click', async () => {
      message.textContent = 'Redirecting to Google…';
      googleButton.disabled = true;
      try {
        await signInWithGoogle();
      } catch (error) {
        googleButton.disabled = false;
        message.textContent = error.message || 'Could not start Google sign-in.';
      }
    });
  </script>
</body>
</html>
