<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – AIConnectPro</title>
  <style>
    body { font: 16px Arial, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 20px; color: #17202a; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0; }
    button { cursor: pointer; }
    #msg { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome back</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <button id="google-login" type="button">Continue with Google</button>
    <p id="msg" role="status" aria-live="polite"></p>
    <p>New here? <a href="signup.html">Create an account</a></p>
  </main>

  <script type="module">
    import { signIn, signInWithGoogle } from './auth.js';

    const form = document.getElementById('login-form');
    const message = document.getElementById('msg');
    const googleButton = document.getElementById('google-login');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Signing in…';
      try {
        await signIn(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        window.location.assign('resume.html');
      } catch (error) {
        message.textContent = error.message || 'Could not sign in.';
      }
    });

    googleButton.addEventListener('click', async () => {
      message.textContent = 'Redirecting to Google…';
      googleButton.disabled = true;
      try {
        await signInWithGoogle();
      } catch (error) {
        googleButton.disabled = false;
        message.textContent = error.message || 'Could not start Google sign-in.';
      }
    });
  </script>
</body>
</html>
