<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="workspace.css">
  <title>Choose Role – AIConnectPro</title>
</head>
<body class="workspace-page"><header class="workspace-header"><div class="workspace-header-inner"><a class="workspace-brand" href="index.html"><span class="workspace-mark">A</span> AIConnectPro</a><nav class="workspace-nav"><a href="jobs.html">Jobs</a><a href="resume.html">Resume Builder</a><a href="profile.html">My Profile</a></nav><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button></div></header><main class="auth-main">
  <h2>Choose your role</h2>

  <button onclick="setRole('user')">Job Seeker / Freelancer</button>
  <button onclick="setRole('company')">Company / Employer</button>

  <p id="msg"></p>

  <script>
    async function setRole(role) {
      const body = {
        role,
        full_name: 'User',
        company_name: role === 'company' ? 'My Company' : null
      };

      const res = await fetch('/api/profile', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + localStorage.token
        },
        body: JSON.stringify(body)
      });

      const j = await res.json();
      if (j.success) {
        window.location.href = 'resume.html';
      } else {
        msg.textContent = j.error;
      }
    }
  </script>
</main><script src="theme.js" defer></script></body>
</html>
