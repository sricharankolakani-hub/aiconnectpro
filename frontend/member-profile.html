<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View a member's shared AIConnectPro profile details.">
  <title>Member Profile – AIConnectPro</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .member-page{max-width:820px;padding-block:3rem 5rem}
    .member-card{padding:clamp(22px,5vw,42px);background:var(--white);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
    .member-identity{display:flex;align-items:center;gap:18px;margin-bottom:28px}
    .member-avatar{width:88px;height:88px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:var(--paper);color:var(--primary);font-size:30px;font-weight:800}
    .member-avatar img{width:100%;height:100%;object-fit:cover}
    .member-identity h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);letter-spacing:-.045em}
    .member-company{margin:.35rem 0 0;color:var(--muted)}
    .member-bio{margin:0 0 24px;color:var(--ink);line-height:1.75;white-space:pre-wrap}
    .member-details{display:grid;gap:0;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
    .member-details li{padding:14px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
    .member-details strong{display:block;margin-bottom:4px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .member-status{color:var(--muted);line-height:1.6}
    body[data-theme=dark] .member-card{background:#171c2b;border-color:#2c3448}
    body[data-theme=dark] .member-details{border-color:#39435c}
    body[data-theme=dark] .member-details li{border-color:#39435c}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell nav-shell">
      <a class="brand" href="index.html" aria-label="AIConnectPro home"><span class="brand-mark">A</span> AIConnectPro</a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="jobs.html">Jobs</a>
        <a href="connections.html">Connections</a>
        <a href="messages.html">Messages</a>
        <a href="profile.html">My Profile</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><span aria-hidden="true">☾</span></button>
    </div>
  </header>
  <main class="shell member-page">
    <p id="member-status" class="member-status" role="status" aria-live="polite">Loading shared profile…</p>
    <article id="member-card" class="member-card" hidden>
      <div class="member-identity">
        <div class="member-avatar" id="member-avatar" aria-hidden="true">A</div>
        <div><p class="eyebrow">AIConnectPro MEMBER</p><h1 id="member-name">Member</h1><p id="member-company" class="member-company" hidden></p></div>
      </div>
      <p id="member-bio" class="member-bio" hidden></p>
      <ul id="member-details" class="member-details"></ul>
      <a id="member-message" class="button button-primary" href="#" hidden>Message connection</a>
    </article>
    <a class="button button-outline" href="connections.html">Back to connections</a>
  </main>
  <script src="theme.js" defer></script>
  <script type="module" src="member-profile.js"></script>
</body>
</html>
