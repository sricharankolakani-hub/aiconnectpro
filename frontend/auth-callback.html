<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in – AIConnectPro</title>
</head>
<body>
  <main>
    <h1>Finishing sign-in</h1>
    <p id="message" role="status" aria-live="polite">Verifying your Supabase session…</p>
    <p><a id="login-link" href="login.html" hidden>Return to login</a></p>
  </main>

  <script type="module">
    import { supabase, getMfaStep, beginGoogleEmailSignupVerification } from './auth.js';

    const message = document.getElementById('message');
    const loginLink = document.getElementById('login-link');

    try {
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const providerError =
        query.get('error_description') ||
        query.get('error') ||
        hash.get('error_description') ||
        hash.get('error');

      if (providerError) throw new Error(providerError);

      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      if (!data.session) {
        throw new Error('No active session was returned. Please try signing in again.');
      }

      const signupConsentKey = 'aiconnectpro.signup-privacy-consent';
      const rawConsent = sessionStorage.getItem(signupConsentKey);
      if (rawConsent) {
        const consent = JSON.parse(rawConsent);
        if (!consent.acceptedAt || consent.policyVersion !== '2026-10-17') {
          throw new Error('Privacy Policy agreement could not be confirmed. Please return to sign up and try again.');
        }

        const { error: consentError } = await supabase.auth.updateUser({
          data: {
            privacy_policy_accepted_at: consent.acceptedAt,
            privacy_policy_version: consent.policyVersion
          }
        });
        if (consentError) throw consentError;
      }

      localStorage.setItem('token', data.session.access_token);
      const { data: currentUserData, error: currentUserError } = await supabase.auth.getUser();
      if (currentUserError) throw currentUserError;
      const currentUser = currentUserData.user;
      const createdAt = Date.parse(currentUser.created_at || '');
      const hasCurrentPrivacyConsent = currentUser.user_metadata?.privacy_policy_version === '2026-10-17';
      if (!rawConsent && !hasCurrentPrivacyConsent && Number.isFinite(createdAt) && Date.now() - createdAt < 10 * 60 * 1000) {
        sessionStorage.setItem('aicp_signup_email', currentUser.email || '');
        window.location.replace('signup.html?stage=google-consent');
        return;
      }
      if (rawConsent && sessionStorage.getItem('aicp_google_email_code_sent') !== 'true') {
        await beginGoogleEmailSignupVerification();
        sessionStorage.setItem('aicp_google_email_code_sent', 'true');
        sessionStorage.setItem('aicp_email_verification_type', 'reauthentication');
        sessionStorage.setItem('aicp_signup_email', currentUser.email || '');
        sessionStorage.removeItem(signupConsentKey);
        window.location.replace('signup.html?stage=google-email');
        return;
      }
      // Phone verification is deferred until an affordable messaging provider is configured.
      sessionStorage.removeItem('aicp_signup_phone');
      sessionStorage.removeItem('aicp_phone_code_sent');
      const mode = await getMfaStep();
      if (mode === 'challenge') {
        message.textContent = 'Signed in. Enter your second-step code…';
        window.location.replace('auth-mfa.html?mode=challenge');
      } else {
        message.textContent = 'Signed in. Opening AIConnectPro…';
        window.location.replace('index.html');
      }
    } catch (error) {
      message.textContent = error.message || 'Sign-in could not be completed.';
      loginLink.hidden = false;
    }
  </script>
</body>
</html>
